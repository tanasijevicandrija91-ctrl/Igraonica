<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR kodovi za meni</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500..900&family=Nunito:wght@400..900&display=swap">
<style>
/* Layout: settings panel on top, a sheet of cut-out cards below; the sheet is what prints. */
:root {
  --paper: #f3f5fb;
  --ink: #1d2340;
  --muted: #5b6185;
  --rule: #dde1ee;
  --field: #ffffff;
  --accent: #1d2340;
  --on-accent: #ffffff;
  --warn: #8a5a00;
  --card: #ffffff;
  --card-ink: #1d2340;
  --display: "Grandstander", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --text: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12152a; --ink: #eef0fb; --muted: #a4a9c8; --rule: #2c3257;
    --field: #1b2040; --accent: #ffcf3d; --on-accent: #1d2340; --warn: #e3b55b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12152a; --ink: #eef0fb; --muted: #a4a9c8; --rule: #2c3257;
  --field: #1b2040; --accent: #ffcf3d; --on-accent: #1d2340; --warn: #e3b55b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 1rem/1.5 var(--text); -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 64rem; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.wrap { padding-block: 28px 8px; }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; }
.lede { margin: 8px 0 0; color: var(--muted); max-width: 40em; }

.panel {
  margin-top: 20px; padding-block: 20px;
  border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule);
}
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 16px 20px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
label { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input, select {
  width: 100%; font: 500 1rem var(--text); color: var(--ink); background: var(--field);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-width: 0;
}
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pair span { color: var(--muted); }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.hint.warn { color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 18px; }
.btn {
  appearance: none; cursor: pointer; border-radius: 999px; padding: 11px 20px;
  font: 700 .9rem var(--text); border: 1px solid var(--accent);
  background: var(--accent); color: var(--on-accent);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.count { color: var(--muted); font-size: .9rem; }

.sheet {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr));
  gap: 20px; padding-block: 24px 48px;
}
.slot { display: grid; gap: 8px; min-width: 0; }
.card {
  background: var(--card); color: var(--card-ink);
  border: 1px solid var(--rule); border-radius: 12px;
  padding: 18px 16px 16px; display: grid; justify-items: center; gap: 8px; text-align: center;
}
.card .rname { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.card .qr { width: 78%; aspect-ratio: 1; max-width: 100%; }
.card .qr svg { display: block; width: 100%; height: 100%; }
.card .caption { margin: 0; font-size: .82rem; font-weight: 700; line-height: 1.35; }
.card .tbl { margin: 2px 0 0; display: grid; justify-items: center; line-height: 1; }
.card .tbl small { font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.card .tbl strong { font-family: var(--display); font-weight: 800; font-size: 2rem; margin-top: 4px; }
.slot-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.slot-actions button {
  appearance: none; cursor: pointer; background: transparent; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 999px; padding: 6px 10px; font: 700 .72rem var(--text);
}
.slot-actions code { flex-basis: 100%; font-family: var(--mono); font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
.empty { color: var(--muted); padding-block: 32px; }

@media print {
  @page { size: A4; margin: 10mm; }
  body { background: #fff; color: #000; }
  .no-print, .slot-actions { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .sheet { grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0; }
  .card {
    border: 1px dashed #9a9a9a; border-radius: 0; break-inside: avoid; page-break-inside: avoid;
    padding: 6mm 4mm; min-height: 88mm; align-content: center;
  }
  .card .rname { font-size: 13pt; }
  .card .qr { width: 40mm; }
  .card .caption { font-size: 8pt; }
  .card .tbl strong { font-size: 20pt; }
}
</style>
</head>
<body>

<header class="wrap no-print">
  <h1>QR kodovi za meni</h1>
  <p class="lede">Unesite link do menija i broj kopija. Svi kodovi vode na isti meni. Kartice se štampaju na A4, po 9 na strani, sa linijama za sečenje.</p>
</header>

<section class="wrap panel no-print" aria-label="Podešavanja">
  <form class="fields" id="form" autocomplete="off">
    <div class="field wide">
      <label for="url">Link do menija</label>
      <input id="url" type="url" inputmode="url" spellcheck="false" required>
      <p class="hint" id="url-hint">Kad je sajt objavljen na Vercelu, ovde je već upisan njegov domen.</p>
    </div>
    <div class="field">
      <label for="lang">Jezik pri otvaranju</label>
      <select id="lang"><option value="">Automatski (jezik telefona)</option></select>
    </div>
    <div class="field">
      <label for="from">Stolovi (nije obavezno)</label>
      <div class="pair">
        <input id="from" type="number" min="1" max="999" inputmode="numeric" placeholder="od" aria-label="Od stola">
        <span>–</span>
        <input id="to" type="number" min="1" max="999" inputmode="numeric" placeholder="do" aria-label="Do stola">
      </div>
    </div>
    <div class="field" id="copies-field">
      <label for="copies">Broj kopija</label>
      <input id="copies" type="number" min="1" max="99" value="9" inputmode="numeric">
    </div>
    <div class="field">
      <label for="caption">Tekst na kartici</label>
      <input id="caption" type="text" value="Skenirajte za meni · Scan for menu">
    </div>
    <div class="field">
      <label for="tlabel">Oznaka stola</label>
      <input id="tlabel" type="text" value="Sto · Table">
    </div>
  </form>
  <div class="actions">
    <button class="btn" type="button" id="print">Štampaj kartice</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
</section>

<main class="wrap">
  <div class="sheet" id="sheet"></div>
</main>

<script src="vendor/qrcode.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const f = {
    url: $('url'), lang: $('lang'), from: $('from'), to: $('to'), copies: $('copies'),
    caption: $('caption'), tlabel: $('tlabel')
  };
  let restaurantName = '';
  let cards = [];

  const isWeb = /^https?:$/.test(location.protocol);
  f.url.value = isWeb ? location.origin + '/' : 'https://meni.vas-restoran.rs/';

  function matrix(text) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const rows = [];
    for (let r = 0; r < n; r++) {
      const row = [];
      for (let c = 0; c < n; c++) row.push(qr.isDark(r, c));
      rows.push(row);
    }
    return rows;
  }

  // Vector QR with a 4-module quiet zone; horizontal runs merged into one rectangle each.
  function svgFor(text) {
    const m = matrix(text);
    const n = m.length, q = 4, size = n + q * 2;
    let d = '';
    for (let r = 0; r < n; r++) {
      let c = 0;
      while (c < n) {
        if (!m[r][c]) { c++; continue; }
        const start = c;
        while (c < n && m[r][c]) c++;
        d += `M${start + q} ${r + q}h${c - start}v1h-${c - start}z`;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="${size}" height="${size}" fill="#ffffff"/><path d="${d}" fill="#000000"/></svg>`;
  }

  function pngFor(text, target = 1200) {
    const m = matrix(text);
    const n = m.length, q = 4, size = n + q * 2;
    const scale = Math.max(4, Math.floor(target / size));
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (m[r][c]) ctx.fillRect((c + q) * scale, (r + q) * scale, scale, scale);
    }
    return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function buildUrl(base, table) {
    const u = new URL(base);
    if (f.lang.value) u.searchParams.set('lang', f.lang.value);
    if (table != null) u.searchParams.set('t', String(table));
    return u.toString();
  }

  function render() {
    const hint = $('url-hint');
    let base;
    try {
      base = new URL(f.url.value.trim());
      if (!/^https?:$/.test(base.protocol)) throw new Error('protocol');
    } catch {
      hint.textContent = 'Link nije ispravan. Primer: https://meni.vas-restoran.rs/';
      hint.className = 'hint warn';
      $('sheet').innerHTML = '<p class="empty">Upišite ispravan link da biste videli QR kodove.</p>';
      $('count').textContent = '';
      cards = [];
      return;
    }
    if (/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(base.hostname)) {
      hint.textContent = 'Ovo je lokalna adresa i radi samo na vašem računaru. Za štampu otvorite ovu stranicu na objavljenom sajtu.';
      hint.className = 'hint warn';
    } else if (base.protocol === 'http:') {
      hint.textContent = 'Preporuka: koristite https:// link.';
      hint.className = 'hint warn';
    } else {
      hint.textContent = 'Svaki QR kod vodi na ovaj link. Izmene menija ne zahtevaju ponovnu štampu.';
      hint.className = 'hint';
    }

    const from = parseInt(f.from.value, 10);
    const to = parseInt(f.to.value, 10);
    cards = [];
    if (from > 0) {
      const end = Math.min(Math.max(to > 0 ? to : from, from), from + 199);
      for (let tnum = from; tnum <= end; tnum++) cards.push({ table: tnum, url: buildUrl(base, tnum) });
      $('copies-field').hidden = true;
    } else {
      const copies = Math.min(Math.max(parseInt(f.copies.value, 10) || 1, 1), 99);
      const url = buildUrl(base, null);
      for (let i = 0; i < copies; i++) cards.push({ table: null, url });
      $('copies-field').hidden = false;
    }

    const caption = f.caption.value.trim();
    const tlabel = f.tlabel.value.trim();
    const svgCache = new Map();
    $('sheet').innerHTML = cards.map((c, i) => {
      if (!svgCache.has(c.url)) svgCache.set(c.url, svgFor(c.url));
      return `<div class="slot">
        <article class="card">
          ${restaurantName ? `<p class="rname">${esc(restaurantName)}</p>` : ''}
          <div class="qr">${svgCache.get(c.url)}</div>
          ${caption ? `<p class="caption">${esc(caption)}</p>` : ''}
          ${c.table != null ? `<p class="tbl"><small>${esc(tlabel)}</small><strong>${c.table}</strong></p>` : ''}
        </article>
        <div class="slot-actions">
          <button type="button" data-i="${i}" data-kind="svg">SVG</button>
          <button type="button" data-i="${i}" data-kind="png">PNG</button>
          <code>${esc(c.url)}</code>
        </div>
      </div>`;
    }).join('');

    const n = cards.length;
    const pages = Math.ceil(n / 9);
    $('count').textContent = `${n} ${plural(n, 'kartica', 'kartice', 'kartica')} · ${pages} ${plural(pages, 'strana', 'strane', 'strana')} A4`;
  }

  // Serbian plural forms: 1/21/31 → one, 2–4/22–24 → few, the rest → many.
  function plural(n, one, few, many) {
    const d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return one;
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return few;
    return many;
  }

  let timer;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 120); };
  document.getElementById('form').addEventListener('input', schedule);
  document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); render(); });
  $('print').addEventListener('click', () => window.print());
  $('sheet').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-kind]');
    if (!b) return;
    const c = cards[Number(b.dataset.i)];
    if (!c) return;
    const name = 'qr-meni' + (c.table != null ? '-sto-' + c.table : '');
    if (b.dataset.kind === 'svg') {
      download(new Blob([svgFor(c.url)], { type: 'image/svg+xml' }), name + '.svg');
    } else {
      const blob = await pngFor(c.url);
      if (blob) download(blob, name + '.png');
    }
  });

  // Restaurant name and languages come from the same menu.json the menu uses.
  fetch('menu.json', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((data) => {
      restaurantName = data.name || (data.restaurant && data.restaurant.name) || '';
      (data.languages || []).forEach((l) => {
        const o = document.createElement('option');
        o.value = l.code;
        o.textContent = l.label || l.code;
        f.lang.appendChild(o);
      });
      if (restaurantName) document.title = 'QR kodovi · ' + restaurantName;
    })
    .catch(() => {})
    .finally(render);
})();
</script>
</body>
</html>
